<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Federal Vision — A Federal Vision for Europe</title>
  <meta name="description" content="An editorial project making the case for European federal union.">
  <meta name="robots" content="index, follow">

  <!-- Google Fonts: Newsreader (Editorial Serif) & IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet">

  <!-- Fontshare Premium Fonts -->
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,500,700,400,900&f[]=satoshi@900,700,500,400,300&display=swap" rel="stylesheet">

  <!-- Open Graph -->
  <meta property="og:title" content="Federal Vision — A Federal Vision for Europe">
  <meta property="og:description" content="An editorial project making the case for European federal union.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://morgan98800.github.io/federal-eu-project/">

  <!-- Canonical -->
  <link rel="canonical" href="https://morgan98800.github.io/federal-eu-project/">

  <!-- Theme persistence — inlined to prevent FOUC -->
  <script>
    (function(){
      var saved = localStorage.getItem('fve-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
